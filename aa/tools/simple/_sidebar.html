<!--AA-SIDEBAR-->
<style>
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
#aa-bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--acc,#6cb6ff);z-index:90;transition:width .1s linear}
#aa-sb{position:fixed;top:0;left:0;bottom:0;width:272px;overflow-y:auto;background:var(--panel,#171d27);color:var(--ink,#e8ecf3);border-right:1px solid var(--line,#2a3344);padding:14px 12px 28px;z-index:80;font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transform:translateX(-102%);transition:transform .22s ease;overscroll-behavior:contain}
#aa-sb *{box-sizing:border-box}
#aa-sb .hd{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 6px}
#aa-sb .hd b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc,#6cb6ff)}
#aa-sb .pct{font:600 26px ui-monospace,Menlo,Consolas,monospace}
#aa-sb .trk{height:6px;border-radius:99px;background:var(--panel2,#1d2431);border:1px solid var(--line,#2a3344);overflow:hidden;margin:0 4px 4px}
#aa-sb .trk i{display:block;height:100%;width:0;background:var(--acc,#6cb6ff);transition:width .1s linear}
#aa-sb .best{font-size:12px;color:var(--mute,#9aa6b8);margin:0 4px 12px}
#aa-sb a{display:flex;gap:8px;align-items:flex-start;text-decoration:none;color:var(--mute,#9aa6b8);border-radius:8px;padding:6px 8px;border-left:3px solid transparent}
#aa-sb a:hover{background:var(--panel2,#1d2431);color:var(--ink,#e8ecf3)}
#aa-sb a .n{flex:none;min-width:20px;height:20px;border-radius:10px;font-size:11px;font-weight:700;display:grid;place-items:center;background:var(--panel2,#1d2431);border:1px solid var(--line,#2a3344);margin-top:1px}
#aa-sb a.top.done .n{background:var(--ok,#5fd39a);border-color:var(--ok,#5fd39a);color:#0b1a12}
#aa-sb a.top.active{color:var(--ink,#e8ecf3);background:var(--rule,#1b2a3d);border-left-color:var(--acc,#6cb6ff);font-weight:600}
#aa-sb a.top.active .n{background:var(--acc,#6cb6ff);border-color:var(--acc,#6cb6ff);color:var(--bg,#10141b)}
#aa-sb .sub{display:none;margin:2px 0 6px 18px;border-left:1px solid var(--line,#2a3344)}
#aa-sb .sub.open{display:block}
#aa-sb .sub a{font-size:13px;padding:4px 8px;border-left:0;border-radius:6px}
#aa-sb .sub a.active{color:var(--acc,#6cb6ff);font-weight:600}
#aa-fab{position:fixed;left:12px;bottom:12px;z-index:85;display:none;align-items:center;gap:8px;background:var(--acc,#6cb6ff);color:var(--bg,#10141b);border:0;border-radius:99px;padding:9px 14px;font:700 14px system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.35);cursor:pointer}
#aa-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:75;display:none}
body.aa-open #aa-sb{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
body.aa-open #aa-back{display:block}
@media (min-width:1200px){
  #aa-sb{transform:none}
  body.aa-has-sb{padding-left:272px}
  #aa-fab,#aa-back{display:none!important}
}
@media (max-width:1199px){#aa-fab{display:flex}}
@media print{#aa-sb,#aa-bar,#aa-fab,#aa-back{display:none!important}body.aa-has-sb{padding-left:0!important}}
</style>
<script>
(function(){
  try{
    var secs=[].slice.call(document.querySelectorAll("section[id]"));
    if(!secs.length)return;
    var M=[],top=null,idx=0;
    function clean(h){var c=h.cloneNode(true);[].slice.call(c.querySelectorAll(".time,.num")).forEach(function(x){x.remove()});return c.textContent.replace(/\s+/g," ").trim()}
    secs.forEach(function(s){
      var h2=s.querySelector("h2");
      if(h2){
        var num=h2.querySelector(".num");idx++;
        top={el:h2,sec:s,type:"top",label:clean(h2),n:num?num.textContent.trim():String(idx),subs:[]};
        M.push(top);
      }
      if(!top)return;
      [].slice.call(s.querySelectorAll("h3")).forEach(function(h){
        var t=clean(h);if(!t)return;
        var m={el:h,sec:s,type:"sub",label:t,parent:top};top.subs.push(m);M.push(m);
      });
    });
    var k=0;M.forEach(function(m){if(!m.el.id)m.el.id="aa-h"+(++k)});
    var sb=document.createElement("nav");sb.id="aa-sb";sb.setAttribute("aria-label","İçindekiler");
    var html='<div class="hd"><b>İçindekiler</b><span class="pct" id="aa-pct">0%</span></div><div class="trk"><i id="aa-trk"></i></div><div class="best" id="aa-best"></div>';
    M.forEach(function(m){
      if(m.type!=="top")return;
      html+='<a class="top" href="#'+m.el.id+'" data-id="'+m.el.id+'"><span class="n">'+m.n+'</span><span>'+m.label.replace(/</g,"&lt;")+'</span></a>';
      if(m.subs.length){html+='<div class="sub" data-for="'+m.el.id+'">'+m.subs.map(function(s){return '<a href="#'+s.el.id+'" data-id="'+s.el.id+'">'+s.label.replace(/</g,"&lt;")+'</a>'}).join("")+'</div>'}
    });
    sb.innerHTML=html;
    var bar=document.createElement("div");bar.id="aa-bar";bar.setAttribute("role","progressbar");bar.setAttribute("aria-valuemin","0");bar.setAttribute("aria-valuemax","100");bar.setAttribute("aria-label","Okuma ilerlemesi");
    var fab=document.createElement("button");fab.id="aa-fab";fab.type="button";fab.innerHTML='☰ İçindekiler · <span id="aa-fpct">0%</span>';
    var back=document.createElement("div");back.id="aa-back";
    document.body.appendChild(bar);document.body.appendChild(sb);document.body.appendChild(fab);document.body.appendChild(back);
    document.body.classList.add("aa-has-sb");
    function toggle(on){document.body.classList.toggle("aa-open",on)}
    fab.onclick=function(){toggle(!document.body.classList.contains("aa-open"))};
    back.onclick=function(){toggle(false)};
    document.addEventListener("keydown",function(e){if(e.key==="Escape")toggle(false)});
    sb.addEventListener("click",function(e){if(e.target.closest("a")&&window.innerWidth<1200)toggle(false)});
    var wk=(location.pathname.match(/\/w(\d+)\//)||[])[1]||"x",KEY="aa_read_w"+wk,best=0;
    try{best=+localStorage.getItem(KEY)||0}catch(e){}
    var links={},tops=[].slice.call(sb.querySelectorAll("a.top")),subWraps=[].slice.call(sb.querySelectorAll(".sub"));
    [].slice.call(sb.querySelectorAll("a[data-id]")).forEach(function(a){links[a.getAttribute("data-id")]=a});
    var pctEl=sb.querySelector("#aa-pct"),trk=sb.querySelector("#aa-trk"),bestEl=sb.querySelector("#aa-best"),fp=fab.querySelector("#aa-fpct");
    var lastActive=null,ticking=false;
    function update(){
      ticking=false;
      var de=document.documentElement,max=de.scrollHeight-window.innerHeight;
      var pct=max>0?Math.min(100,Math.max(0,Math.round(100*window.pageYOffset/max))):100;
      if(max>0&&window.pageYOffset>=max-4)pct=100;
      bar.style.width=pct+"%";bar.setAttribute("aria-valuenow",pct);
      pctEl.textContent=pct+"%";trk.style.width=pct+"%";fp.textContent=pct+"%";
      if(pct>best){best=pct;try{localStorage.setItem(KEY,String(best))}catch(e){}}
      bestEl.textContent=best>pct?"En ileri okunan: %"+best:"";
      var act=M[0];
      for(var i=0;i<M.length;i++){if(M[i].el.getBoundingClientRect().top<=150)act=M[i];else break}
      var vh=window.innerHeight;
      tops.forEach(function(a){
        var m=M.filter(function(x){return x.el.id===a.getAttribute("data-id")})[0];
        var r=m.sec.getBoundingClientRect();
        var next=m.sec;
        var passed=r.bottom<=vh*0.35;
        a.classList.toggle("done",passed);
        a.querySelector(".n").textContent=passed?"✓":m.n;
      });
      if(act!==lastActive){
        lastActive=act;
        var topM=act.type==="top"?act:act.parent;
        [].slice.call(sb.querySelectorAll("a.active")).forEach(function(a){a.classList.remove("active")});
        links[topM.el.id].classList.add("active");
        if(act.type==="sub")links[act.el.id].classList.add("active");
        subWraps.forEach(function(w){w.classList.toggle("open",w.getAttribute("data-for")===topM.el.id)});
        var a=links[act.el.id],c=sb;
        if(a&&c.scrollHeight>c.clientHeight){var ar=a.getBoundingClientRect(),cr=c.getBoundingClientRect();
          if(ar.top<cr.top+90||ar.bottom>cr.bottom-40)c.scrollTop+=ar.top-cr.top-cr.height/3}
      }
    }
    function onScroll(){if(!ticking){ticking=true;requestAnimationFrame(update)}}
    window.addEventListener("scroll",onScroll,{passive:true});window.addEventListener("resize",onScroll);
    window.addEventListener("load",onScroll);setTimeout(update,300);update();
  }catch(e){if(window.console)console.warn("aa sidebar",e)}
})();
</script>
<!--/AA-SIDEBAR-->
