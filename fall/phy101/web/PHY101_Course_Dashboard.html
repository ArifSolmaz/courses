<style>
  :root {
    --bg: #f5f7fa; --surface: #ffffff; --surface2: #eef1f6; --border: #d4dae4;
    --phy-orange: #e65100; --phy-blue: #1565c0; --accent-green: #2e7d32;

    --lecture-bg: #fff3e0; --lecture-border: #e65100;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  .topbar { display: flex; align-items: center; justify-content: space-between; height: 54px; padding: 0 2rem;
    background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }

  .topbar-nav a.active { background: var(--phy-blue); color: #fff; border-color: var(--phy-blue); }
  .layout { display: flex; height: calc(100vh - 54px); }
  .sidebar { width: 270px; min-width: 270px; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border); padding: 1rem 0; }
  .sidebar-label { display: block; padding: .5rem 1.2rem .35rem; }
  .week-btn { display: flex; align-items: flex-start; gap: .75rem; width: 100%; text-align: left; border: 0; border-left: 3px solid transparent; background: none; cursor: pointer; font: inherit; }
  .week-btn.active { border-left-color: var(--phy-blue); }
  .sidebar-link { text-decoration: none; color: inherit; }
  .week-num { flex: 0 0 34px; font-size: .72rem; padding-top: .15rem; }
  .week-title { display: block; line-height: 1.3; }
  .week-date { display: block; font-size: .65rem; color: var(--text-muted); margin-top: .2rem; }
  .main { flex: 1; overflow-y: auto; }
  .week-panel { display: none; }
  .week-panel.active { display: block; }
  .week-header { display: block; }
  .week-meta { font-family: 'JetBrains Mono', monospace; font-size: .74rem; color: var(--text-muted); margin: .9rem 0 0; }
  .notebook-card { display: flex; flex-wrap: wrap; align-items: center; gap: .9rem 1.2rem; max-width: 760px; margin: 1.6rem 0;
    padding: 1.1rem 1.3rem; border: 1px solid var(--lecture-border); border-radius: 12px; background: var(--lecture-bg); }
  .notebook-card .what { flex: 1 1 280px; font-size: .9rem; line-height: 1.6; color: var(--text-muted); }
  .notebook-card .what strong { color: var(--text); display: block; margin-bottom: .2rem; }
  .button-row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
  .nb-btn { display: inline-block; text-decoration: none; padding: .6rem 1rem; border-radius: 7px; font-family: 'JetBrains Mono', monospace; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; }
  .nb-btn.secondary { background: var(--surface2); color: var(--phy-blue); border: 1px solid var(--border); }
  .goals { max-width: 760px; margin: 1.4rem 0 1.8rem; padding-left: 1.2rem; line-height: 1.7; font-size: .93rem; }
  .goals li + li { margin-top: .3rem; }
  .line { max-width: 760px; font-size: .88rem; line-height: 1.65; color: var(--text-muted); margin: .7rem 0; }
  .line strong { color: var(--text); }
  .line a { color: var(--phy-blue); }
  .prev-next { display: flex; justify-content: space-between; gap: 1rem; max-width: 760px; margin-top: 2.2rem; padding-top: 1.2rem; border-top: 1px solid var(--border); font-size: .85rem; }
  .prev-next a { color: var(--phy-blue); text-decoration: none; }
  .overview-wrap { overflow-x: auto; max-width: 1000px; margin-top: 1.6rem; }
  .calendar-overview { width: 100%; border-collapse: collapse; font-size: .84rem; background: var(--surface); }
  .calendar-overview th, .calendar-overview td { padding: .7rem .75rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; line-height: 1.5; }
  .calendar-overview th { font-size: .68rem; }
  .calendar-overview td:first-child { white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: .78rem; }
  .calendar-overview a { color: var(--phy-blue); }
  .calendar-overview .nb-btn:not(.secondary) { color: #fff; }
  .calendar-overview .button-row { min-width: 175px; }
  .ext-row { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem 1.2rem; max-width: 900px; padding: 1rem 0; border-bottom: 1px solid var(--border); }
  .ext-row .what { flex: 1 1 320px; }
  .ext-row .what strong { display: block; margin-bottom: .2rem; }
  .ext-row .what span { display: block; font-size: .85rem; color: var(--text-muted); line-height: 1.55; }
  .week-btn:focus-visible, a:focus-visible { outline: 3px solid var(--phy-blue); outline-offset: 2px; }
  .week-heading:focus { outline: none; }
  @media (max-width: 900px) { .sidebar { width: 200px; min-width: 200px; } .week-date { display: none; } }
  @media (max-width: 600px) {
    .calendar-overview { display: block; }
    .calendar-overview thead { display: none; }
    .calendar-overview tbody { display: grid; gap: .8rem; }
    .calendar-overview tr { display: block; border: 1px solid var(--border); border-radius: 8px; padding: .7rem; }
    .calendar-overview td { display: block; border: 0; padding: .3rem 0; }
    .calendar-overview .button-row { min-width: 0; }
  }
</style>

<script>
// All dates, titles, notebook paths and solution release dates come from ../calendar.json (via phy101-calendar.js).
const CALENDAR = window.PHY101_CALENDAR;
const COLAB = 'https://colab.research.google.com/github/ArifSolmaz/courses/blob/main/fall/phy101/';
const SOLUTION_TOPICS = {1:'Units and vectors', 2:'One-dimensional motion', 3:'Two-dimensional motion', 4:'Newton’s laws and friction',
  5:'Circular motion', 6:'Work and energy', 7:'Momentum and collisions', 8:'Equilibrium and centre of mass', 9:'Rotation',
  10:'Angular momentum', 11:'Periodic motion', 12:'Resonance', 13:'Waves and sound', 14:'Review and projects'};
const GOALS = {
  1:['Convert quantities to consistent SI units.','Resolve and combine vector components.','Check dimensions before calculating.'],
  2:['Read position, velocity and acceleration graphs.','Rearrange constant-acceleration equations.','Choose signs consistently in free fall.'],
  3:['Separate horizontal and vertical motion.','State Newton’s three laws in a simple example.','Draw one free-body diagram before writing F = ma.'],
  4:['Distinguish static and kinetic friction.','Resolve forces parallel and normal to an incline.','Check a connected-body calculation with a diagram.'],
  5:['Calculate work from a force and displacement.','Apply net work = change in kinetic energy.','Rearrange for speed and explain the sign of work.'],
  6:['Rebuild one motion solution without looking at the answer.','Explain a force diagram and each algebraic step.','Use units and limiting cases to repair mistakes.'],
  7:['Use the announced examination arrangements.','Review only the material taught before the midterm.','Return to the Week 06 notebook for the review routes.'],
  8:['Choose a reference height for gravitational energy.','Account for kinetic, gravitational and spring energy.','Include dissipative work once, with the correct sign.'],
  9:['Use signs and components in momentum.','Separate a collision from any later motion.','Check both momentum and the change in kinetic energy.'],
  10:['Convert revolutions and RPM to radians and rad/s.','Use angular kinematics only when its assumptions hold.','Calculate inertia for the stated shape and axis.'],
  11:['Use net torque = inertia × angular acceleration.','Include translation and rotation in rolling energy.','Check the no-slip relation between linear and angular motion.'],
  12:['Calculate a mass-weighted centre of mass.','Balance forces and torques about a chosen pivot.','Interpret the direction and feasibility of reaction forces.'],
  13:['Connect restoring force with periodic motion.','Calculate a spring or small-angle pendulum period.','Use initial position and velocity to describe the motion.']
};
const NOTES = {
  6:'Review week, no new topic: three fully solved review routes and five review problems.',
  7:'Midterm week. The exact exam date, room and rules are announced separately; no new topic.',
  12:'Joining for the final weeks? The notebook starts with a recap and application questions for Mechatronics, Computer and Chemical Engineering.',
  13:'Final scheduled topic. Damping is an optional section at the end of the notebook.'
};

const pad = n => String(n).padStart(2, '0');
const escapeHTML = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateLabel(iso, year=false) {
  return new Intl.DateTimeFormat('en-GB', {timeZone:'Europe/Istanbul', day:'numeric', month:'short', ...(year?{year:'numeric'}:{})}).format(new Date(iso+'T12:00:00+03:00'));
}
const dateRange = w => `${dateLabel(w.start)} – ${dateLabel(w.end, true)}`;
function today() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/Istanbul', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date()).filter(x => x.type !== 'literal').map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
function notebookButtons(path, label) {
  return `<div class="button-row"><a class="nb-btn" href="${COLAB + path}" target="_blank" rel="noopener" aria-label="Open ${escapeHTML(label)} in Colab">Open in Colab</a>
    <a class="nb-btn secondary" href="../${escapeHTML(path)}" download aria-label="Download ${escapeHTML(label)} notebook">Download notebook</a></div>`;
}
function solutionLine(n) {
  const date = CALENDAR.release_dates[String(n)];
  const file = `solutions/Week_${pad(n)}_Python_Solutions.ipynb`;
  const released = date && today() >= date;
  return `<p class="line"><strong>Complete solution file</strong> (${escapeHTML(SOLUTION_TOPICS[n])}, problems labelled <em>Module ${pad(n)} Pn</em>): `
    + (released ? `<a href="${COLAB + file}" target="_blank" rel="noopener">open in Colab</a>.` : `opens ${dateLabel(date, true)}. Until then use the answers inside the notebook to check yourself.`) + `</p>`;
}

function overviewPanel() {
  const rows = CALENDAR.weeks.map(w => `<tr><td>${pad(w.week)}<br>${escapeHTML(dateRange(w))}</td>
    <td><a href="#week-${w.week}" data-panel-link="week-${w.week}">${escapeHTML(w.title_en)}</a><br><span lang="tr">${escapeHTML(w.title_tr)}</span></td>
    <td>${w.lab ? escapeHTML(w.lab.title_tr) + (w.lab.brief ? ` · <a href="../${escapeHTML(w.lab.brief)}">brief</a>` : '') : '—'}</td>
    <td>${notebookButtons(w.notebook, 'Week ' + pad(w.week))}</td></tr>`).join('');
  return `<section class="week-panel" id="overview"><header class="week-header">
    <div class="week-tag">${escapeHTML(CALENDAR.term)} · 13 weeks · Mechatronics, Computer and Chemical Engineering</div>
    <h1 class="week-heading" tabindex="-1">Physics I<br><em lang="tr">Fizik I</em></h1>
    <p class="week-desc">One notebook per week. Each contains the concepts with worked algebra, interactive checks with a prediction prompt, worked examples and a three-level problem set whose answers let you check yourself. <strong>Open in Colab</strong> runs it in the browser; <strong>Download notebook</strong> saves it for Jupyter. Paper and a calculator are enough; Python is optional.</p>
    <p class="week-desc" lang="tr">Her hafta için tek bir not vardır ve o haftanın tamamını kapsar. Notu tarayıcıda açmak için “Open in Colab”, indirmek için “Download notebook”.</p>
    <p class="week-desc"><strong>The topic order and the experiments are set by the departmental schedule, and the midterm and final are common examinations</strong> shared with the parallel sections. Examinable scope is the Week 01–13 topic list only: the extension notebooks, the gravitation supplement and the laboratory analysis technique are enrichment and are not examined. See the <a href="../COURSE_POLICY.md">course policy</a> and the <a href="../TEXTBOOK_MAP.md">textbook &amp; laboratory map</a>.</p>
    <p class="week-desc" lang="tr"><strong>Haftalık konu sırası ve deneyler bölüm izlencesine göredir; vize ve final ortak sınavdır.</strong> Sınav kapsamı yalnızca 01–13. hafta konularıdır; ek notlar ve laboratuvar analiz teknikleri kapsam dışıdır.</p></header>
    <div class="overview-wrap"><table class="calendar-overview"><thead><tr><th>Week / Dates</th><th>Lecture / Ders</th><th>Laboratory / Deney</th><th>Notebook / Not</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>`;
}

function weekPanel(w) {
  const kind = w.kind === 'review' ? 'Review week' : w.kind === 'midterm' ? 'Midterm week' : 'Lecture';
  const session = w.session_date ? ` · ${kind} ${dateLabel(w.session_date, true)}` : ` · ${kind}, exact date announced separately`;
  const what = w.kind === 'midterm' ? 'Preparation only: a worked self-check and an error-log routine.'
    : w.kind === 'review' ? 'Three fully solved review routes and five review problems with answers.'
    : 'Concepts with worked algebra, interactive checks, worked examples and a three-level problem set with answers to check against.';
  const goals = (GOALS[w.week] || []).map(g => `<li>${escapeHTML(g)}</li>`).join('');
  const ext = w.support_modules.map(n => CALENDAR.extensions[String(n)]).filter(Boolean)
    .map(x => `<p class="line"><strong>Optional extension:</strong> ${escapeHTML(x.title_en)} / ${escapeHTML(x.title_tr)} — <a href="${COLAB + x.notebook}" target="_blank" rel="noopener">open in Colab</a> · <a href="#extensions" data-panel-link="extensions">all extensions</a>.</p>`).join('');
  const solutions = w.kind === 'teaching' ? w.modules.map(solutionLine).join('') : '';
  const lab = w.lab ? `<p class="line"><strong>Laboratory / Deney:</strong> ${escapeHTML(w.lab.title_tr)} — ${escapeHTML(w.lab.title_en)}. ${escapeHTML(w.lab.focus)}.`
      + (w.lab.brief ? ` <a href="../${escapeHTML(w.lab.brief)}">Open the brief</a> · <a href="../labs/Lab_00_Uncertainty_Toolkit.ipynb">uncertainty toolkit</a>.` : ' All briefs are in <a href="../labs/">labs/</a>.')
      + (w.lab.covers_week && w.lab.covers_week !== w.week ? ` It measures the physics of Week ${pad(w.lab.covers_week)}.` : '')
      + ` Laboratory analysis technique is not examined in the common exams.</p>` : '';
  const prev = CALENDAR.weeks.find(x => x.week === w.week - 1), next = CALENDAR.weeks.find(x => x.week === w.week + 1);
  return `<section class="week-panel" id="week-${w.week}" data-calendar-week="${w.week}">
    <header class="week-header">
      <div class="week-tag">Week ${pad(w.week)} of ${CALENDAR.weeks.length} · ${escapeHTML(dateRange(w))}${escapeHTML(session)}</div>
      <h1 class="week-heading" tabindex="-1">${escapeHTML(w.title_en)}<br><em lang="tr">${escapeHTML(w.title_tr)}</em></h1>
      <p class="week-desc">${escapeHTML(w.scope)}.${NOTES[w.week] ? ' ' + escapeHTML(NOTES[w.week]) : ''}</p>
    </header>
    <div class="notebook-card">
      <div class="what"><strong>Week ${pad(w.week)} notebook</strong>${what}<br><span class="nb-filename">${escapeHTML(w.notebook)}</span></div>
      ${notebookButtons(w.notebook, 'Week ' + pad(w.week))}
    </div>
    <div class="section-title">${w.kind === 'midterm' ? 'This week' : 'By the end of this week you can'}</div>
    <ul class="goals">${goals}</ul>
    ${lab}${solutions}${ext}
    <div class="prev-next"><span>${prev ? `<a href="#week-${prev.week}" data-panel-link="week-${prev.week}">← Week ${pad(prev.week)}: ${escapeHTML(prev.title_en)}</a>` : ''}</span>
      <span>${next ? `<a href="#week-${next.week}" data-panel-link="week-${next.week}">Week ${pad(next.week)}: ${escapeHTML(next.title_en)} →</a>` : `<a href="#extensions" data-panel-link="extensions">Optional extension notebooks →</a>`}</span></div>
  </section>`;
}

function extensionsPanel() {
  const rows = Object.entries(CALENDAR.extensions).map(([key, x]) => {
    const n = Number(key);
    const where = x.supports_week ? `Supports Week ${pad(x.supports_week)}` : 'Beyond the scheduled calendar';
    return `<div class="ext-row"><div class="what"><strong>${escapeHTML(x.title_en)} <em lang="tr">/ ${escapeHTML(x.title_tr)}</em></strong>
      <span>${where} · same structure as a weekly notebook · problems labelled Module ${pad(n)} · solution file opens ${dateLabel(CALENDAR.release_dates[String(n)], true)}</span></div>
      ${notebookButtons(x.notebook, x.title_en)}</div>`;
  }).join('');
  return `<section class="week-panel" id="extensions"><header class="week-header">
    <div class="week-tag">Optional · ${Object.keys(CALENDAR.extensions).length} notebooks · not scheduled weeks</div>
    <h1 class="week-heading" tabindex="-1">Extension notebooks<br><em lang="tr">İsteğe bağlı ek notlar</em></h1>
    <p class="week-desc">The 13 weekly notebooks are the course. These add more for students who want it; none is required.</p></header>${rows}</section>`;
}

function showPanel(key, updateHash = true) {
  const panel = document.getElementById(key);
  if (!panel || !panel.classList.contains('week-panel')) return;
  document.querySelectorAll('.week-panel').forEach(p => p.classList.toggle('active', p === panel));
  document.querySelectorAll('#calendar-navigation .week-btn').forEach(b => {
    const on = b.dataset.panel === key; b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  document.querySelectorAll('.topbar-nav a[data-panel-link]').forEach(a => a.classList.toggle('active', a.dataset.panelLink === key));
  if (updateHash && window.location.hash !== '#' + key) window.history.replaceState(null, '', '#' + key);
  document.getElementById('course-content').scrollTop = 0;
  panel.querySelector('h1')?.focus({preventScroll: true});
}

function build() {
  if (!CALENDAR || !Array.isArray(CALENDAR.weeks) || CALENDAR.weeks.length !== 13) {
    document.getElementById('course-content').innerHTML = '<p>The course calendar could not load. Refresh this page or open the syllabus.</p>';
    throw new Error('Expected the 13-week PHY101 calendar');
  }
  document.getElementById('calendar-navigation').innerHTML = `<span class="sidebar-label">Physics I · Fall 2026–27</span>
    <button class="week-btn" type="button" data-panel="overview"><span class="week-num">All</span><span class="week-title">Calendar overview</span></button>
    <a class="week-btn sidebar-link" href="../History%20of%20Physics/index.html"><span class="week-num">HIS</span><span class="week-title">History Portal</span></a>
    ${CALENDAR.weeks.map(w => `<button class="week-btn" type="button" data-panel="week-${w.week}" title="Week ${w.week}: ${escapeHTML(w.title_en)}">
      <span class="week-num">W${pad(w.week)}</span><span class="week-title">${escapeHTML(w.title_en)}<span class="week-date">${escapeHTML(dateRange(w))}</span></span></button>`).join('')}
    <button class="week-btn" type="button" data-panel="extensions"><span class="week-num">+</span><span class="week-title">Extension notebooks<span class="week-date">optional</span></span></button>
    <a class="week-btn sidebar-link" href="../notebooks/Final_Review.ipynb"><span class="week-num">FIN</span><span class="week-title">Final review<span class="week-date">Weeks 01–13</span></span></a>
    <a class="week-btn sidebar-link" href="../labs/Lab_00_Uncertainty_Toolkit.ipynb"><span class="week-num">LAB</span><span class="week-title">Uncertainty toolkit<span class="week-date">all experiments</span></span></a>
    <a class="week-btn sidebar-link" href="../TEXTBOOK_MAP.md"><span class="week-num">MAP</span><span class="week-title">Textbook &amp; lab map<span class="week-date">chapters per week</span></span></a>`;
  document.getElementById('course-content').innerHTML = overviewPanel() + CALENDAR.weeks.map(weekPanel).join('') + extensionsPanel();
  document.querySelectorAll('[data-panel]').forEach(b => b.addEventListener('click', () => showPanel(b.dataset.panel)));
  document.querySelectorAll('[data-panel-link]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); showPanel(a.dataset.panelLink); }));
  window.addEventListener('hashchange', () => showPanel(window.location.hash.slice(1) || 'overview', false));
  const key = window.location.hash.slice(1);
  showPanel(document.getElementById(key) ? key : 'overview', false);
}
build();
</script>
</body>
</html>
