function weekResources(w) {
  const web = NOTE_PAGES.includes(w.week) ? `<a href="../w${w.week}/" title="Open the weekly web notes" aria-label="Week ${pad(w.week)} web notes">Web notes <span aria-hidden="true">→</span></a>` : '';
  const summary = w.week === 2 ? '<a href="../w2/#ch1-summary" title="The textbook\'s Chapter 1 summary, placed at the start of Week 02" aria-label="Chapter 1 summary at the start of Week 02">Ch-1 summary <span aria-hidden="true">→</span></a>' : '';
  const colab = `<a href="${COLAB + w.notebook}" title="Colab Notes — open the interactive Python notebook in Google Colab" aria-label="Week ${pad(w.week)} Colab notes">Colab notes <span aria-hidden="true">↗</span></a>`;
  const chapter = w.textbook ? `<a href="${escapeHTML(w.textbook.url)}" title="${escapeHTML(w.textbook.title)}" aria-label="${escapeHTML(w.textbook.title)}">${escapeHTML(w.textbook.label)} <span aria-hidden="true">↗</span></a>` : '';
  return `<div class="week-resources" role="group" aria-label="Week ${pad(w.week)} resources">${web}${summary}${colab}${chapter}</div>`;
}

function overviewPanel() {
  const suggested = CALENDAR.weeks.find(w => w.week === CURRENT_WEEK) || [...CALENDAR.weeks].reverse().find(w => w.start <= TODAY) || CALENDAR.weeks[0];
  const start = NOTE_PAGES.includes(suggested.week) ? `../w${suggested.week}/` : COLAB + suggested.notebook;
  const rows = CALENDAR.weeks.map(w => `<tr><td>${pad(w.week)}</td><td><strong>${escapeHTML(w.title_en)}</strong><p class="chapter-description">${escapeHTML(CHAPTER_DESCRIPTIONS[w.week])}</p><small>${escapeHTML(shortRange(w))}</small>${w.lab ? `<small>Lab: ${escapeHTML(w.lab.title_en)}</small>` : ''}</td><td>${weekResources(w)}</td></tr>`).join('');
  return `<section class="week-panel" id="overview"><header class="dashboard-intro"><p class="week-tag">PHY101 · ${escapeHTML(CALENDAR.term)} · Dr. Arif Solmaz</p><h1 tabindex="-1">Physics I</h1><p>Draw the situation, choose an equation, then calculate and check. Open a week for the lesson, worked examples and practice.</p><p class="dashboard-meta">13 weeks · Paper and a scientific calculator · Python is optional</p></header>
  <article class="start-week"><p class="week-tag">Week ${pad(suggested.week)} · ${escapeHTML(shortRange(suggested))}</p><h2>${escapeHTML(suggested.title_en)}</h2><a class="nb-btn" href="${start}">Open Week ${pad(suggested.week)} →</a></article>
  <div data-activity-container hidden><p data-activity-status></p><a class="nb-btn" data-activity-join hidden style="display:none" href="../calc/students.html">Join today’s calculator activity →</a></div>
  <section class="course-schedule" id="weeks"><h2>Weekly lessons</h2><table><thead><tr><th>Week</th><th>Topic</th><th>Resources</th></tr></thead><tbody>${rows}</tbody></table></section>
  <details class="resource-section" id="course-info"><summary>Course information &amp; resources</summary><div><p>The departmental topic and laboratory order is fixed. The midterm and final are common examinations. Exam scope is Weeks 01–13; extensions and laboratory analysis techniques are enrichment.</p><ul class="resource-links"><li><a href="PHY101_Syllabus.html">Syllabus &amp; assessment</a></li><li><a href="../TEXTBOOK_MAP.md">Textbook &amp; laboratory map</a></li><li><a href="${COLAB}notebooks/Final_Review.ipynb">Final review</a></li><li><a href="${COLAB}labs/Lab_00_Uncertainty_Toolkit.ipynb">Laboratory toolkit</a></li><li><a href="#extensions" data-panel-link="extensions">Optional extensions</a></li><li><a href="../History%20of%20Physics/index.html">History of Physics</a></li><li><a href="../COURSE_POLICY.md">Course policy</a></li></ul><details><summary>Instructor tools</summary><p><a href="../calc/instructor.html">Calculator activity sign-in</a></p></details></div></details></section>`;
}

function weekPanel(w) {
  const kind = w.kind === 'review' ? 'Review week' : w.kind === 'midterm' ? 'Midterm week' : 'Lecture';
  const session = w.session_date ? ` · ${kind} ${dateLabel(w.session_date, true)}` : ` · ${kind}, exact date announced separately`;
  const what = w.kind === 'midterm' ? 'Preparation only: a worked self-check and an error-log routine.'
    : w.kind === 'review' ? 'Three fully solved review routes and five review problems with answers.'
    : 'Concepts with worked algebra, interactive checks, worked examples and a three-level problem set with answers to check against.';
  const goals = (GOALS[w.week] || []).map(g => `<li>${escapeHTML(g)}</li>`).join('');
  const ext = w.support_modules.map(n => CALENDAR.extensions[String(n)]).filter(Boolean)
    .map(x => `<div class="aside-card"><h3>Optional extension</h3><div class="big">${escapeHTML(x.title_en)}</div><div class="sub" lang="tr">${escapeHTML(x.title_tr)}</div>
      <p><a href="${COLAB + x.notebook}" target="_blank" rel="noopener">Open in Colab</a> · <a href="#extensions" data-panel-link="extensions">all extensions</a> · not examined</p></div>`).join('');
  const solutions = w.kind === 'teaching' ? w.modules.map(solutionLine).join('') : '';
  const lab = w.lab ? `<div class="aside-card"><h3>Laboratory · Deney</h3><div class="big">${escapeHTML(w.lab.title_en)}</div><div class="sub" lang="tr">${escapeHTML(w.lab.title_tr)}</div>
      <p>${escapeHTML(w.lab.focus)}.${w.lab.covers_week && w.lab.covers_week !== w.week ? ` It measures the physics of Week ${pad(w.lab.covers_week)}.` : ''} Laboratory analysis technique is not examined in the common exams.</p>
      <p>${w.lab.brief ? `<a href="../${escapeHTML(w.lab.brief)}">Open the brief</a> · <a href="../labs/Lab_00_Uncertainty_Toolkit.ipynb">uncertainty toolkit</a>` : 'All briefs are in <a href="https://github.com/ArifSolmaz/courses/tree/main/fall/phy101/labs">labs/</a>'}</p></div>`
    : `<div class="aside-card"><h3>Laboratory · Deney</h3><div class="sub">${w.kind === 'midterm' ? 'No laboratory in the midterm week.' : 'No laboratory this week.'}</div></div>`;
  const prev = CALENDAR.weeks.find(x => x.week === w.week - 1), next = CALENDAR.weeks.find(x => x.week === w.week + 1);
  const lessonURL = NOTE_PAGES.includes(w.week) ? `../w${w.week}/` : COLAB + w.notebook;
  return `<section class="week-panel" id="week-${w.week}" data-calendar-week="${w.week}"><header class="page-head"><div><p class="week-tag">Week ${pad(w.week)} · ${escapeHTML(dateRange(w))}${escapeHTML(session)}</p><h1 class="week-heading" tabindex="-1">${escapeHTML(w.title_en)}<span class="tr" lang="tr">${escapeHTML(w.title_tr)}</span></h1><p class="week-desc">${escapeHTML(w.scope)}.${NOTES[w.week] ? ' ' + escapeHTML(NOTES[w.week]) : ''}</p></div></header>
  <a class="nb-btn" href="${lessonURL}">Start Week ${pad(w.week)} →</a><p class="route-note">Follow Prepare → Learn → Practise → Check. The lesson tells you when to open Colab.</p>
  <details class="path-resources"><summary>Laboratory${w.lab ? ' · '+escapeHTML(w.lab.title_en) : ' · no session'}</summary><div>${lab}</div></details>
  <details class="path-resources"><summary>Goals, notebook &amp; solutions</summary><div><ol>${goals}</ol>${notebookButtons(w.notebook, 'Week '+pad(w.week))}${solutions}${ext}</div></details>
  <nav class="simple-week-nav" aria-label="Adjacent weeks">${prev ? `<a href="#week-${prev.week}" data-panel-link="week-${prev.week}">← Week ${pad(prev.week)}</a>` : '<a href="#overview" data-panel-link="overview">Course home</a>'}${next ? `<a href="#week-${next.week}" data-panel-link="week-${next.week}">Week ${pad(next.week)} →</a>` : '<a href="#overview" data-panel-link="overview">Course home</a>'}</nav></section>`;
}

function extensionsPanel() {
  const rows = Object.entries(CALENDAR.extensions).map(([key, x]) => {
    const n = Number(key);
    const where = x.supports_week ? `Supports Week ${pad(x.supports_week)}` : 'Beyond the scheduled calendar';
    return `<div class="ext-row"><div class="what"><strong>${escapeHTML(x.title_en)} <em lang="tr">/ ${escapeHTML(x.title_tr)}</em></strong>
      <span>${where} · same structure as a weekly notebook · problems labelled Module ${pad(n)} · solution file opens ${dateLabel(CALENDAR.release_dates[String(n)], true)}</span></div>
      ${notebookButtons(x.notebook, x.title_en)}</div>`;
  }).join('');
  return `<section class="week-panel" id="extensions"><header class="page-head"><div>
    <div class="week-tag">Optional · ${Object.keys(CALENDAR.extensions).length} notebooks · not scheduled weeks · not examined</div>
    <h1 class="week-heading" tabindex="-1">Extension notebooks<span class="tr" lang="tr">İsteğe bağlı ek notlar</span></h1>
    <p class="week-desc">The 13 weekly notebooks are the course. These add more for students who want it; none is required.</p></div></header>${rows}</section>`;
}

function showPanel(key, updateHash = true) {
  const panel = document.getElementById(key);
  if (!panel || !panel.classList.contains('week-panel')) return;
  document.querySelectorAll('.week-panel').forEach(p => p.classList.toggle('active', p === panel));
  if (document.getElementById('phy-week')) document.getElementById('phy-week').value = key;
  document.querySelectorAll('#calendar-navigation .strip-btn').forEach(b => {
    const on = b.dataset.panel === key; b.classList.toggle('active', on);
    if (on) { b.setAttribute('aria-current', 'page'); b.scrollIntoView({block: 'nearest', inline: 'nearest'}); } else b.removeAttribute('aria-current');
  });
  document.querySelectorAll('.topbar-nav a[data-panel-link]').forEach(a => a.classList.toggle('active', a.dataset.panelLink === key));
  if (updateHash && window.location.hash !== '#' + key) window.history.replaceState(null, '', '#' + key);
  window.scrollTo({top: 0, behavior: 'auto'});
  if (updateHash) panel.querySelector('h1')?.focus({preventScroll: true});
}

function build() {
  if (!CALENDAR || !Array.isArray(CALENDAR.weeks) || CALENDAR.weeks.length !== 13) {
    document.getElementById('course-content').innerHTML = '<p>The course calendar could not load. Refresh this page or open the syllabus.</p>';
    throw new Error('Expected the 13-week PHY101 calendar');
  }
  document.getElementById('calendar-navigation').innerHTML = '';
  document.getElementById('course-content').innerHTML = overviewPanel() + CALENDAR.weeks.map(weekPanel).join('') + extensionsPanel();
  document.querySelectorAll('[data-panel]').forEach(b => b.addEventListener('click', () => showPanel(b.dataset.panel)));
  document.querySelectorAll('[data-panel-link]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); showPanel(a.dataset.panelLink); }));
  function followLocation() {
    const target = document.getElementById(window.location.hash.slice(1));
    showPanel(target?.closest('.week-panel')?.id || 'overview', false);
    if (target && !target.classList.contains('week-panel')) {
      if (target.tagName === 'DETAILS') target.open = true;
      requestAnimationFrame(() => target.scrollIntoView({block:'start'}));
    }
  }
  window.addEventListener('hashchange', followLocation);
  followLocation();
}
build();
</script>
<script src="../calc/activity.js?v=2"></script>
